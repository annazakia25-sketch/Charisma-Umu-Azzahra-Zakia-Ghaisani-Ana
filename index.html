<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Ekstrakurikuler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="registrationForm">
            <h1>Pendaftaran Ekstrakurikuler</h1>
            <p>Silakan isi data diri dengan benar.</p>

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap">
                <small id="namaError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contoh@email.com">
                <small id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 8 karakter">
                <small id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Masukkan ulang password">
                <small id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="ekskul">Pilihan Ekstrakurikuler</label>
                <select id="ekskul">
                    <option value="">-- Pilih Ekstrakurikuler --</option>
                    <option value="Pramuka">Pramuka</option>
                    <option value="Paskibra">Paskibra</option>
                    <option value="PMR">PMR</option>
                    <option value="Futsal">Futsal</option>
                    <option value="Voly">Voly</option>
                    <option value="Jurnalis">Jurnalis</option>
                    <option value="B Jepang">B Jepang</option>
                    <option value="Padus">Padus</option>
                    <option value="Tari">Tari</option>
                    <option value="Rohis">Rohis</option>
                </select>
                <small id="ekskulError"></small>
            </div>

            <button type="submit">Daftar Sekarang</button>

            <div id="successMessage"></div>
        </form>
    </div>

    <!-- ================= CHATBOT ================= -->
    <button id="chatToggle" aria-label="Buka bantuan" aria-expanded="false">
        <span id="chatToggleIcon">💬</span>
    </button>

    <div id="chatbot" class="chat-hidden" role="dialog" aria-label="Bantuan pendaftaran">
        <div class="chat-header">
            <div>
                <strong>Asisten Ekskul</strong>
                <span>Tanya apa saja soal pendaftaran</span>
            </div>
            <button id="chatClose" aria-label="Tutup bantuan">&times;</button>
        </div>

        <div id="chatBody"></div>

        <div id="chatQuickReplies"></div>

        <form id="chatForm">
            <input type="text" id="chatInput" placeholder="Tulis pertanyaan..." autocomplete="off">
            <button type="submit" id="chatSend" aria-label="Kirim pesan">Kirim</button>
        </form>
    </div>
    <!-- =============== AKHIR CHATBOT ============== -->

    <script src="script.js"></script>
</body>
</html>
